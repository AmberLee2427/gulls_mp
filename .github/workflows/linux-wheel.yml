name: Linux Wheel

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - "gulls_pipeline/**"
      - "smoke_test/**"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/linux-wheel.yml"

jobs:
  build-wheel:
    name: Build Linux wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gfortran \
            libcfitsio-dev \
            libgsl-dev

      - name: Build Gulls executables
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Stage executables into package
        run: |
          mkdir -p gulls_pipeline/bin gulls_pipeline/runtime/src
          cp bin/gulls_std.x gulls_pipeline/bin/
          cp bin/gulls_general.x gulls_pipeline/bin/
          cp bin/gulls_croin.x gulls_pipeline/bin/
          cp bin/gullsFish.x gulls_pipeline/bin/
          cp bin/generateMoffat gulls_pipeline/bin/
          cp bin/generateMoffatPSF gulls_pipeline/bin/
          cp bin/precompute_psf gulls_pipeline/bin/
          cp bin/txt2fits gulls_pipeline/bin/
          cp src/ESPL.tbl gulls_pipeline/runtime/src/
          chmod 755 gulls_pipeline/bin/*

      - name: Show executable shared-library dependencies
        run: |
          ldd gulls_pipeline/bin/gulls_general.x
          ldd gulls_pipeline/bin/gullsFish.x

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel
          python -m twine check dist/*

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = [
              "gulls_pipeline/web/index.html",
              "gulls_pipeline/bin/gulls_general.x",
              "gulls_pipeline/bin/gullsFish.x",
              "gulls_pipeline/runtime/src/ESPL.tbl",
              "smoke_test/parameterfiles/smoke_general.prm",
              "smoke_test/assets/sources/smoke.sources",
              "smoke_test/assets/observatories/smoke.list",
          ]
          missing = [
              name for name in required
              if not any(entry == name or entry.endswith(f"/{name}") for entry in names)
          ]
          if missing:
              raise SystemExit(f"Wheel is missing expected files: {missing}")
          if "linux" not in wheel.name or "none-any" in wheel.name or "-py3-none-" not in wheel.name:
              raise SystemExit(f"Expected a platform-specific Linux wheel, got {wheel.name}")
          print(f"Built {wheel}")
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: gulls-linux-wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
